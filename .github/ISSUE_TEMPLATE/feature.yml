name: Inventory workflow
description: Describe a concrete workflow to add or improve.
title: "Workflow: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Use invented item names and quantities. Do not include private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How could this be checked?
