[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchstock"
version = "0.1.0"
description = "Offline parts inventory and project-kit reservations for a personal workbench."
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
benchstock = "benchstock.cli:main"

[tool.setuptools.packages.find]
include = ["benchstock*"]
